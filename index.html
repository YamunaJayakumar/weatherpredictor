<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weatherapi</title>
</head>
<body>
    <input type="text"placeholder="enter the location" id="inputLocation">
    <button type="button" onclick="findWeather()">search</button>
    <div id="output " class="container">
         <div class="col-5 me-2 try d-flex flex-column align-items-end justify-content-center"style="border-radius: 1.5rem;">
                <div class="name  text-center p-2  w-100">
                    <h1><i class="fa-solid fa-location-dot"></i>yyy</h1>
                </div>
                <div class="temp  text-center p-3 w-100 ">
                    <h3><i class="fa-solid fa-temperature-half"></i>jui</h3>
                </div>
                

    </div>
</body>
<script>
    const findWeather =async ()=>{
        const inputloc=inputLocation.value
        console.log(inputloc)
        try{
            const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${inputloc}&appid=8ac5c4d57ba6a4b3dfcf622700447b1e&units=metric`)
            console.log(response)
            if(response.status!=200){
                alert("Enter a valid city name")
                inputLocation.value=''

            }
            const result=await response.json()
            console.log(result)
            const temp= result.main.temp
            console.log(temp)
            const humidity=result.main.humidity
            console.log(humidity)
            const pressure=result.main.pressure
            console.log(pressure)
            const locname=result.name
            console.log(locname)
            const country=result.sys.country
            console.log(country)
            const weatherdata=Object.values(result.weather[0])
            console.log(weatherdata[1],weatherdata[2])
        
          
        }catch(error){
            alert("error while fetching")
        }
    }
    const gettime=()=>{
        const now=new Date()
       console.log(now)
    }
        


    
</script>
</html>
